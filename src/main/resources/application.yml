server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticketing-system
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticketing_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:v9y$B&E)H@MbQeThWmZq4t7w!z%C*F-JaNdRfUjXn2r5u8x/A?D(G+KbPeShVkYp}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

seed:
  admin:
    email: ${SEED_ADMIN_EMAIL:admin@example.com}
    password: ${SEED_ADMIN_PASSWORD:Admin@12345}
